<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="Crônicas de Éter — RPG Solo">
  <title>Crônicas de Éter — RPG Solo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #09090d;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    #status {
      width: min(90%, 520px);
      padding: 32px;
      text-align: center;
      border: 1px solid #51432d;
      border-radius: 14px;
      background: #121117;
    }

    h1 {
      color: #d8b36a;
      letter-spacing: 2px;
      font-size: 22px;
    }

    p {
      color: #aaa;
      line-height: 1.6;
    }

    #error {
      color: #ff8c8c;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main id="status">
    <h1>CRÔNICAS DE ÉTER</h1>
    <p id="message">Conectando ao mundo de Éter...</p>
    <p id="error"></p>
  </main>

  <script>
  (async function iniciarCronicas() {
    "use strict";

    /*
     * GITHUB PAGES:
     * Hospeda este index.html e mantém o endereço público do site.
     *
     * SUPABASE:
     * Fornece o HTML principal, os módulos, CSS,
     * banco de dados, autenticação e funções.
     *
     * NÃO UTILIZA SUPABASE STORAGE.
     */

    const APP_ENDPOINT =
      "https://wwumjtorusjblitkzyjt.supabase.co/functions/v1/eter-web";

    const ASSET_BASE =
      APP_ENDPOINT.replace(/\/+$/, "") + "/assets/";

    const message = document.getElementById("message");
    const errorBox = document.getElementById("error");

    function mostrarErro(erro) {
      message.textContent =
        "Não foi possível carregar o aplicativo.";

      errorBox.textContent =
        String(erro && erro.message ? erro.message : erro);
    }

    try {
      message.textContent =
        "Conectando ao servidor de Crônicas de Éter...";

      const resposta = await fetch(APP_ENDPOINT, {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });

      if (!resposta.ok) {
        throw new Error(
          "Erro no Supabase: HTTP " + resposta.status
        );
      }

      let html = await resposta.text();

      if (
        !html ||
        !html.toLowerCase().includes("<html") ||
        !html.toLowerCase().includes("</body>")
      ) {
        throw new Error(
          "O servidor não retornou um documento HTML válido."
        );
      }

      /*
       * CORREÇÃO PRINCIPAL:
       *
       * Os caminhos dos arquivos não podem ser resolvidos
       * pelo endereço do GitHub Pages.
       *
       * Todos os arquivos do aplicativo devem ser buscados
       * diretamente na rota de assets da função eter-web.
       */

      // Corrige caminhos absolutos da função.
      html = html.replace(
        /((?:src|href)\s*=\s*["'])\/functions\/v1\/eter-web\/assets\//gi,
        "$1" + ASSET_BASE
      );

      // Corrige caminhos absolutos /assets/.
      html = html.replace(
        /((?:src|href)\s*=\s*["'])\/assets\//gi,
        "$1" + ASSET_BASE
      );

      // Corrige caminhos relativos assets/.
      html = html.replace(
        /((?:src|href)\s*=\s*["'])assets\//gi,
        "$1" + ASSET_BASE
      );

      /*
       * O navegador continua na URL do GitHub Pages.
       * Somente o conteúdo e os recursos são carregados
       * do backend Supabase.
       */

      document.open();
      document.write(html);
      document.close();

    } catch (erro) {
      mostrarErro(erro);
      console.error(
        "Erro ao iniciar Crônicas de Éter:",
        erro
      );
    }
  })();
  </script>
</body>
</html>
