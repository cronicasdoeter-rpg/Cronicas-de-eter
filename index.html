
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c11">
<meta name="description" content="Crônicas de Éter — RPG medieval de fantasia">
<title>Crônicas de Éter</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#0b0c11;color:#e9e5dc;font-family:Arial,sans-serif}
body{display:grid;place-items:center;min-height:100vh}
#loading{text-align:center;padding:30px}
#loading h2{color:#f0d39a;font-family:Georgia,serif;letter-spacing:2px}
#loading p{color:#929bad;font-size:13px}
#error{display:none;max-width:500px;margin:20px;padding:22px;border:1px solid #78434a;border-radius:10px;background:#24171c;color:#f0b5b5;line-height:1.6}
</style>
</head>
<body>
<div id="loading">
<h2>CRÔNICAS DE ÉTER</h2>
<p>Carregando o mundo...</p>
</div>
<div id="error">
<h3>Não foi possível carregar o jogo.</h3>
<p id="errorMessage">Verifique sua conexão e tente novamente.</p>
</div>
<script>
(async function(){
"use strict";
const SUPABASE_APP="https://wwumjtorusjblitkzyjt.supabase.co/functions/v1/eter-app";
try{
const response=await fetch(SUPABASE_APP+"/",{method:"GET",cache:"no-store"});
if(!response.ok)throw new Error("Erro ao carregar aplicativo: HTTP "+response.status);
let html=await response.text();
if(!html.includes("<html")||!html.includes("Crônicas de Éter"))throw new Error("Conteúdo recebido inválido.");
html=html.replace(/src=(["'])\.\/(solo|dados|rpg-ui)\.js\1/g,function(_,quote,file){
return "src="+quote+SUPABASE_APP+"/"+file+".js"+quote;
});
document.open();
document.write(html);
document.close();
}catch(error){
document.getElementById("loading").style.display="none";
document.getElementById("error").style.display="block";
document.getElementById("errorMessage").textContent=error.message||"Erro desconhecido.";
}
})();
</script>
</body>
</html>
